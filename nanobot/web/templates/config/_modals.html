
<!-- Matrix Confirm Modal -->
<div id="matrix-modal-overlay" class="hidden fixed inset-0 z-50 flex items-center justify-center" style="display:none; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px);">
    <div class="border border-red-500/50 bg-black/95 max-w-md w-full mx-4 shadow-[0_0_40px_rgba(255,0,0,0.15)] animate-modalIn">
        <!-- Header -->
        <div class="flex items-center gap-3 px-5 py-3 border-b border-red-500/30 bg-red-500/5">
            <span class="material-symbols-outlined text-red-400 text-lg">warning</span>
            <span id="matrix-modal-title" class="text-red-400 font-bold uppercase tracking-[0.3em] text-xs">CONFIRM</span>
            <span id="matrix-modal-subtitle" class="ml-auto text-red-500/30 text-[9px] font-mono">SYS.RESTART</span>
        </div>
        <!-- Body -->
        <div class="px-5 py-5">
            <pre id="matrix-modal-message" class="text-primary/80 text-[11px] font-mono leading-relaxed whitespace-pre-wrap"></pre>
        </div>
        <!-- Footer -->
        <div class="flex items-center gap-3 px-5 py-3 border-t border-red-500/20 bg-red-500/5">
            <button onclick="matrixModalAction(true)"
                class="px-6 py-2 border border-red-500/60 bg-red-500/10 text-red-400 font-bold uppercase tracking-[0.2em] text-[10px] hover:bg-red-500 hover:text-black transition-all duration-200 flex items-center gap-2">
                <span class="material-symbols-outlined text-xs">restart_alt</span>
                <span id="matrix-modal-confirm-text">CONFIRM RESTART</span>
            </button>
            <button onclick="matrixModalAction(false)" id="matrix-modal-cancel-btn"
                class="px-6 py-2 border border-primary/20 bg-primary/5 text-primary/60 font-bold uppercase tracking-[0.2em] text-[10px] hover:bg-primary/20 hover:text-primary transition-all duration-200">
                CANCEL
            </button>
        </div>
    </div>
</div>

<!-- OAuth Flow Modal -->
<div id="oauth-flow-modal-overlay" class="hidden fixed inset-0 z-50 flex items-center justify-center" style="display:none; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px);">
    <div class="border border-primary/50 bg-black/95 max-w-2xl w-full mx-4 shadow-[0_0_40px_rgba(0,255,65,0.12)] animate-modalIn">
        <div class="flex items-center gap-3 px-5 py-3 border-b border-primary/30 bg-primary/5">
            <span class="material-symbols-outlined text-primary text-lg">key</span>
            <span id="oauth-flow-modal-title" class="text-primary font-bold uppercase tracking-[0.3em] text-xs">OAUTH LOGIN</span>
            <span id="oauth-flow-modal-subtitle" class="ml-auto text-primary/30 text-[9px] font-mono">SYS.OAUTH</span>
        </div>
        <div class="px-5 py-5 space-y-4">
            <div id="oauth-flow-warning" class="hidden border border-yellow-400/30 bg-yellow-400/5 px-3 py-2 text-yellow-400/80 text-[10px] font-mono"></div>
            <div class="space-y-2">
                <label class="text-[10px] font-bold uppercase tracking-[0.25em] text-primary/70">Login URL</label>
                <div class="flex gap-2">
                    <input type="text" id="oauth-flow-auth-url" readonly
                        class="flex-1 bg-black/60 border border-primary/30 outline-none px-3 py-2 text-primary/70 font-mono text-[10px]">
                    <button type="button" onclick="oauthFlowCopyUrl()"
                        class="px-3 py-2 border border-primary/30 text-primary/60 hover:text-primary hover:border-primary hover:bg-primary/10 transition-all text-[10px] font-bold uppercase tracking-wider">Copy</button>
                </div>
            </div>
            <div class="space-y-2">
                <label id="oauth-flow-input-label" class="text-[10px] font-bold uppercase tracking-[0.25em] text-primary/70">Paste callback URL</label>
                <textarea id="oauth-flow-callback-input" rows="3"
                    class="w-full bg-black/60 border border-primary/30 focus:border-primary outline-none px-3 py-2 text-primary font-mono text-[10px] placeholder-primary/30 transition-all duration-300"></textarea>
            </div>
            <div id="oauth-flow-status" class="hidden text-[10px] font-mono"></div>
        </div>
        <div class="flex items-center gap-3 px-5 py-3 border-t border-primary/20 bg-primary/5">
            <button type="button" onclick="oauthFlowSubmit()" id="oauth-flow-submit-btn"
                class="px-6 py-2 border border-primary/60 bg-primary/10 text-primary font-bold uppercase tracking-[0.2em] text-[10px] hover:bg-primary hover:text-black transition-all duration-200 flex items-center gap-2">
                <span class="material-symbols-outlined text-xs">login</span>
                <span id="oauth-flow-submit-text">CONFIRM</span>
            </button>
            <button type="button" onclick="closeOAuthFlowModal()"
                class="px-6 py-2 border border-primary/20 bg-primary/5 text-primary/60 font-bold uppercase tracking-[0.2em] text-[10px] hover:bg-primary/20 hover:text-primary transition-all duration-200">
                CANCEL
            </button>
        </div>
    </div>
</div>
