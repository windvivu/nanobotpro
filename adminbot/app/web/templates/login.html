<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Adminbot Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/adminbot.css" />
</head>
<body class="auth-body">
    <main class="auth-page">
        <section class="auth-card" aria-label="Adminbot login form">
            <div class="auth-brand">
                <div class="brand-mark"><span class="material-symbols-outlined" aria-hidden="true">smart_toy</span></div>
                <div>
                    <div class="brand-title">Adminbot</div>
                    <div class="brand-subtitle"><span class="material-symbols-outlined" aria-hidden="true">memory</span>Local Multi-Bot Manager</div>
                </div>
            </div>
            <div class="auth-heading">
                <h1>Sign in</h1>
                <p>Authenticate before managing local bot processes.</p>
            </div>
            {% if message %}
            <div class="flash flash-success">{{ message }}</div>
            {% endif %}
            {% if error %}
            <div class="flash flash-error">{{ error }}</div>
            {% endif %}
            <form class="stack-form" method="post" action="/login">
                <label>
                    <span>Username</span>
                    <input name="username" required type="text" autocomplete="username" autofocus spellcheck="false" />
                </label>
                <label>
                    <span>Password</span>
                    <input name="password" required type="password" autocomplete="current-password" />
                </label>
                <p class="field-help">
                    First login uses <code>admin</code> / <code>abc123</code>. You must change the password before managing bots.
                </p>
                <div class="form-actions">
                    <button class="button button-primary auth-submit" type="submit"><span class="material-symbols-outlined" aria-hidden="true">login</span>Login</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
